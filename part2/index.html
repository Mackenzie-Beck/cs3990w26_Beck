<script>
    let username = prompt("Please enter username")

    if (username === "admin" || username === "ADMIN" || username === "Admin"){
        adminLogin()
    }
    else if (username === "designer"){
            desingerLogin()
    }
    else if (username === "tester"){
            testerLogin()
    }
    else {
        alert("There is no such user!")
    }


    function adminLogin(){
        for(let i = 0; i< 2; i++){
            let pass = generatePassword()
            let adminpass = prompt("Please Enter Admin Password")
            if (adminpass == pass){
                window.location.href = 'admin.html';
            }
        }
        alert("Too many log in attempts. Acess Denied!")

    }

    function desingerLogin(){
        for(let i = 0; i<3; i++){
            let pass = prompt("Please enter designer password")
            if(pass == -111){
                window.location.href = 'designer.html'
            }
        }
    }

    function testerLogin(){
        for(let i = 0; i<3; i++){
            let pass = prompt("Please enter tester password")
            if(pass == -222){
                window.location.href = 'tester.html'
            }
        }    
    }


    function generatePassword(){
        let digits = []
        digits.push((Math.floor(Math.random()*10)).toString())


        for(let i = 0; i < 5; i++){
            let num = Math.floor(Math.random()*10);
            num = num.toString();
            digits.push(num)
        }
        let password = digits.join("")
        console.log(password)
        return password
        
    }
</script>
