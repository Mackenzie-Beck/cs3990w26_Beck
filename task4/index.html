 <!DOCTYPE html>
<html>

<title>Mackenzie Beck</title>



<meta charset="UTF-8"/>

<meta name="viewport" content="width=device-width, intial-scale=1.0" />

<link rel="stylesheet" href="Style.css">

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>






<body>
    <script type="module">
        import {Fruits} from "./fruitList.js";
        import {Fruit} from "./Fruit.js";
        import {RatedFruit} from "./Fruit.js";
        import {ColorButton} from "./btnColor.js"


        let assignedColors = []
        for (let fruitdata of Fruits){
            let fruit = new RatedFruit(fruitdata.fruit, fruitdata.color, 3); 
            if (!assignedColors.includes(fruitdata.color)){
                let button = new ColorButton(fruitdata.color);
                button.show();
                assignedColors.push(fruitdata.color)
            }
            
            fruit.show();
        }

    </script>
    <script src = "btnHandler.js"></script>
    <div id="colors">
        <h2> Select Color</h2>
    </div>

    <div id="fruits">
        <ul>Fruits:

        </ul>
        
    </div>
</body>
