<script>
    function sayHi(){
        let language = prompt("Please enter abbreviation of the language you speak (Eng, Fr, De, Spa, etc...)")

        switch(language){
            case "Eng":
                alert("Hello!");
                break;
            case "Fr":
                alert("Bonjour!");
                break;
            case "De":
                alert("Hallo!");
                break;

        }
    }
